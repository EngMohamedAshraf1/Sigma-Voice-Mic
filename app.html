<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <title>Sigma Voice</title>

  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a22;
      --panel-2: #1d212b;
      --text: #f4f5f7;
      --muted: #a9afbb;
      --accent: #8b4dff;
      --accent-2: #a76cff;
      --danger: #d64545;
      --ok: #39b56b;
      --border: #2a2f3b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #191326 0, var(--bg) 42%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(900px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 18px 28px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-mark {
      color: var(--accent-2);
      font-size: 24px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
    }

    .hero {
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .mic-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #micButton {
      width: clamp(150px, 32vw, 220px);
      height: clamp(150px, 32vw, 220px);
      border-radius: 50%;
      border: 8px solid rgba(139, 77, 255, .24);
      background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent) 65%, #5a25b7 100%);
      color: white;
      box-shadow: 0 0 0 10px rgba(139, 77, 255, .08), 0 18px 45px rgba(0,0,0,.4);
      cursor: pointer;
      font-size: clamp(48px, 10vw, 72px);
      touch-action: none;
      user-select: none;
    }

    #micButton.recording {
      background: radial-gradient(circle at 35% 30%, #ff6b6b, #c93434 65%, #8e1e1e 100%);
      border-color: rgba(214, 69, 69, .3);
      box-shadow: 0 0 0 12px rgba(214, 69, 69, .09), 0 18px 45px rgba(0,0,0,.4);
    }

    #micButton.locked {
      background: radial-gradient(circle at 35% 30%, #63d68f, #29975a 65%, #1f6a40 100%);
      border-color: rgba(57, 181, 107, .28);
    }

    .status {
      min-height: 28px;
      text-align: center;
      font-size: 16px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .toolbar button.active {
      border-color: rgba(139, 77, 255, .5);
      background: rgba(139, 77, 255, .12);
    }

    .result-card {
      background: linear-gradient(180deg, rgba(29,33,43,.98), rgba(23,26,34,.98));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      min-height: 150px;
    }

    .result-title {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    #resultText {
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 17px;
    }

    .controls {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .controls.visible { display: flex; }

    .action-button {
      min-width: 140px;
      padding: 13px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 16px;
    }

    #sendButton {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    #cancelButton {
      background: var(--panel);
      color: var(--text);
    }

    .kbd {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    footer {
      padding-top: 18px;
      text-align: center;
      color: #737987;
      font-size: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.68);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 20;
    }

    .modal-backdrop.visible { display: flex; }

    .modal {
      width: min(420px, 100%);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,.45);
    }

    .modal h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .modal p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .modal input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 15px;
    }

    #authButton {
      background: var(--accent);
      color: white;
      border-color: transparent;
    }

    #authMessage {
      min-height: 24px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    #backendBridge {
      position: fixed;
      width: 1px;
      height: 1px;
      border: 0;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
    }

    @media (max-width: 600px) {
      .app { padding: 12px 12px 20px; }
      .hero h1 { font-size: 29px; }
      .hero p { font-size: 14px; }
      .result-card { padding: 16px; }
      #resultText { font-size: 16px; }
      .kbd { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span class="brand-mark">▮▮▮</span>
        <span>Sigma Voice</span>
      </div>
      <button id="settingsButton" class="icon-button" type="button" aria-label="الإعدادات">⚙</button>
    </header>

    <main class="main">
      <section class="hero">
        <h1>مرحبًا بك في Sigma Voice</h1>
        <p>اضغط على الميكروفون وتحدث بطلبك</p>
      </section>

      <section class="mic-zone">
        <button id="micButton" type="button" aria-label="تحدث">🎤</button>
        <div id="status" class="status">جاري الاتصال...</div>

        <div class="toolbar">
          <button id="soundButton" type="button" class="active">🔊 الصوت: مفعّل</button>
        </div>
      </section>

      <section id="controls" class="controls">
        <button id="cancelButton" class="action-button" type="button">إلغاء</button>
        <button id="sendButton" class="action-button" type="button">إرسال ➤</button>
      </section>

      <div class="kbd">على اللابتوب: ↑ تثبيت · Enter إرسال · Esc إلغاء</div>

      <section class="result-card">
        <div class="result-title">النتيجة</div>
        <div id="resultText">ستظهر نتيجة طلبك هنا...</div>
      </section>
    </main>

    <footer>واجهة Sigma Voice الجديدة</footer>
  </div>

  <iframe id="backendBridge" title="Sigma backend bridge"></iframe>

  <div id="authModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <h2>دخول Sigma Voice</h2>
      <p>أدخل كلمة المرور مرة لبدء الاتصال بالخدمة في هذه الجلسة.</p>
      <input id="authInput" type="password" placeholder="كلمة المرور" autocomplete="off">
      <div id="authMessage"></div>
      <div class="modal-actions">
        <button id="authButton" type="button">دخول</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxBiL92vdz_94KkNGDLwDV6HCu8vWuXU6a9r_fTl9yiQF-D2nmAxlPLCybrHqTieYjuug/exec";

    const APP_ORIGIN = window.location.origin;

    const micButton = document.getElementById("micButton");
    const statusEl = document.getElementById("status");
    const controls = document.getElementById("controls");
    const sendButton = document.getElementById("sendButton");
    const cancelButton = document.getElementById("cancelButton");
    const resultText = document.getElementById("resultText");
    const soundButton = document.getElementById("soundButton");
    const settingsButton = document.getElementById("settingsButton");
    const backendBridge = document.getElementById("backendBridge");

    const authModal = document.getElementById("authModal");
    const authInput = document.getElementById("authInput");
    const authButton = document.getElementById("authButton");
    const authMessage = document.getElementById("authMessage");

    let recording = false;
    let locked = false;
    let pointerActive = false;
    let startY = 0;
    let soundEnabled = true;
    let recognition = null;
    let transcript = "";
    let backendAuthenticated = false;
    let authResolver = null;
    let requestCounter = 0;
    const pendingRequests = new Map();

    const LOCK_DISTANCE = 60;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function resetUI() {
      recording = false;
      locked = false;
      pointerActive = false;
      transcript = "";
      micButton.classList.remove("recording", "locked");
      controls.classList.remove("visible");
      setStatus(backendAuthenticated ? "اضغط وتحدث" : "جاري الاتصال...");
    }

    function showAuthModal() {
      authModal.classList.add("visible");
      authModal.setAttribute("aria-hidden", "false");
      authMessage.textContent = "";
      authInput.value = "";
      setTimeout(function() { authInput.focus(); }, 50);
    }

    function hideAuthModal() {
      authModal.classList.remove("visible");
      authModal.setAttribute("aria-hidden", "true");
    }

    function requestBackend(type, payload) {
      return new Promise(function(resolve, reject) {
        const requestId = String(++requestCounter);
        const timer = setTimeout(function() {
          pendingRequests.delete(requestId);
          reject(new Error("انتهت مهلة الاتصال بالخدمة."));
        }, 30000);

        pendingRequests.set(requestId, {
          resolve: resolve,
          reject: reject,
          timer: timer
        });

        backendBridge.contentWindow.postMessage(
          Object.assign({
            type: "sigma:bridge:" + type,
            requestId: requestId
          }, payload || {}),
          "*"
        );
      });
    }

    window.addEventListener("message", function(event) {
      if (event.source !== backendBridge.contentWindow) {
        return;
      }

      const data = event.data || {};

      if (data.type !== "sigma:bridgeResult") {
        return;
      }

      const pending = pendingRequests.get(data.requestId);

      if (!pending) {
        return;
      }

      clearTimeout(pending.timer);
      pendingRequests.delete(data.requestId);
      pending.resolve(data.result);
    });

    backendBridge.addEventListener("load", function() {
      setStatus("جاهز");
    });

    backendBridge.src = APPS_SCRIPT_URL;

    function ensureAuthenticated() {
      if (backendAuthenticated) {
        return Promise.resolve(true);
      }

      showAuthModal();

      return new Promise(function(resolve) {
        authResolver = resolve;
      });
    }

    async function authenticate() {
      const passphrase = authInput.value.trim();

      if (!passphrase) {
        authMessage.textContent = "أدخل كلمة المرور أولًا.";
        return;
      }

      authButton.disabled = true;
      authMessage.textContent = "جاري التحقق...";

      try {
        const result = await requestBackend("auth", {
          passphrase: passphrase
        });

        if (result && result.success) {
          backendAuthenticated = true;
          hideAuthModal();
          setStatus("اضغط وتحدث");

          if (authResolver) {
            const resolve = authResolver;
            authResolver = null;
            resolve(true);
          }
        } else {
          authMessage.textContent =
            (result && result.message) || "تعذر تسجيل الدخول.";
        }
      } catch (error) {
        authMessage.textContent = error.message;
      } finally {
        authButton.disabled = false;
      }
    }

    authButton.addEventListener("click", authenticate);

    authInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        authenticate();
      }
    });

    settingsButton.addEventListener("click", function() {
      showAuthModal();
    });

    function startRecognition() {
      const SpeechRecognitionImpl =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognitionImpl) {
        setStatus("التعرف على الصوت غير مدعوم في هذا المتصفح.");
        return false;
      }

      recognition = new SpeechRecognitionImpl();
      recognition.lang = "ar-EG";
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onresult = function(event) {
        let finalPart = "";
        let interimPart = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const part = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalPart += part + " ";
          } else {
            interimPart += part + " ";
          }
        }

        if (finalPart) {
          transcript = (transcript + " " + finalPart).trim();
        }

        const liveText = (transcript + " " + interimPart).trim();
        if (liveText) {
          resultText.textContent = liveText;
        }
      };

      recognition.onerror = function(event) {
        if (recording) {
          setStatus("تعذّر التعرف على الصوت: " + event.error);
        }
      };

      recognition.onend = function() {
        if (recording && locked) {
          try { recognition.start(); } catch (e) {}
        }
      };

      try {
        recognition.start();
        return true;
      } catch (e) {
        setStatus("تعذّر بدء التسجيل.");
        return false;
      }
    }

    function beginRecording() {
      if (recording) return;

      recording = true;
      locked = false;
      pointerActive = true;
      transcript = "";
      resultText.textContent = "جاري التقاط الكلام...";
      micButton.classList.add("recording");
      setStatus("جاري التسجيل... اسحب لأعلى للتثبيت");
      controls.classList.remove("visible");

      if (!startRecognition()) {
        cancelRecording();
      }
    }

    function lockRecording() {
      if (!recording || locked) return;

      locked = true;
      pointerActive = false;
      micButton.classList.remove("recording");
      micButton.classList.add("locked");
      controls.classList.add("visible");
      setStatus("تم تثبيت التسجيل — أرسل عندما تنتهي");
    }

    async function sendRecording() {
      if (!recording || !locked) return;

      recording = false;
      controls.classList.remove("visible");
      setStatus("جاري الفهم والحساب...");

      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }

      const text = transcript.trim();

      if (!text) {
        resetUI();
        resultText.textContent = "لم يتم التقاط أي نص.";
        return;
      }

      try {
        const authenticated = await ensureAuthenticated();

        if (!authenticated) {
          resetUI();
          return;
        }

        const result = await requestBackend("calculate", {
          text: text
        });

        if (!result || result.success !== true) {
          setStatus("تعذر حساب الطلب.");
          resultText.textContent =
            (result && result.message) || "حدث خطأ غير متوقع.";
          return;
        }

        const invoice = String(result.value || "");
        resultText.textContent = invoice;
        setStatus("تم الحساب بنجاح");

        if (soundEnabled && invoice.indexOf("الإجمالي") !== -1) {
          setStatus("تم الحساب — جاري تجهيز الصوت...");

          const audioResult = await requestBackend("synthesize", {
            text: invoice
          });

          if (audioResult && audioResult.success && audioResult.audioBase64) {
            const audio = new Audio(
              "data:audio/wav;base64," +
              audioResult.audioBase64
            );

            try {
              await audio.play();
              setStatus("تم الحساب وتشغيل الصوت");
            } catch (error) {
              setStatus("تم الحساب. اضغط تشغيل الصوت من المتصفح إن لزم.");
            }
          } else {
            setStatus("تم الحساب، وتعذّر تجهيز الصوت.");
          }
        }

      } catch (error) {
        setStatus("حدث خطأ في الاتصال بالخدمة.");
        resultText.textContent = error.message;
      } finally {
        micButton.classList.remove("recording", "locked");
        recording = false;
        locked = false;
      }
    }

    function cancelRecording() {
      if (!recording) return;

      recording = false;
      locked = false;
      pointerActive = false;
      controls.classList.remove("visible");
      micButton.classList.remove("recording", "locked");
      setStatus("تم الإلغاء");

      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
    }

    micButton.addEventListener("pointerdown", function(event) {
      micButton.setPointerCapture?.(event.pointerId);
      pointerActive = true;
      startY = event.clientY;
      beginRecording();
    });

    micButton.addEventListener("pointermove", function(event) {
      if (!pointerActive || !recording || locked) return;
      if (startY - event.clientY > LOCK_DISTANCE) lockRecording();
    });

    micButton.addEventListener("pointerup", function() {
      if (!pointerActive) return;
      pointerActive = false;
      if (recording && !locked) cancelRecording();
    });

    micButton.addEventListener("pointercancel", cancelRecording);
    sendButton.addEventListener("click", sendRecording);
    cancelButton.addEventListener("click", cancelRecording);

    window.addEventListener("keydown", function(event) {
      if (event.key === "ArrowUp" && recording && !locked) {
        event.preventDefault();
        lockRecording();
      } else if (event.key === "Enter" && locked) {
        event.preventDefault();
        sendRecording();
      } else if (event.key === "Escape" && recording) {
        event.preventDefault();
        cancelRecording();
      }
    });

    soundButton.addEventListener("click", function() {
      soundEnabled = !soundEnabled;
      soundButton.classList.toggle("active", soundEnabled);
      soundButton.textContent = soundEnabled ? "🔊 الصوت: مفعّل" : "🔇 الصوت: متوقف";
    });

    authModal.addEventListener("click", function(event) {
      if (event.target === authModal) {
        event.preventDefault();
      }
    });

    resetUI();
  </script>
</body>
</html>
